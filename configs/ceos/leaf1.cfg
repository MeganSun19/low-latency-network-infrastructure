hostname leaf1
!
service routing protocols model multi-agent
!
ip routing
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.11/32
!
interface Ethernet1
   description TO_SPINE1_ETH1
   no switchport
   ip address 10.0.0.1/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description TO_SPINE2_ETH1
   no switchport
   ip address 10.0.0.5/31
   pim ipv4 sparse-mode
!
interface Ethernet4
   description TO_RECEIVER_A
   no switchport
   ip address 172.16.101.1/30
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router bgp 65201
   router-id 10.255.0.11
   neighbor 10.0.0.0 remote-as 65101
   neighbor 10.0.0.0 description SPINE1
   neighbor 10.0.0.4 remote-as 65102
   neighbor 10.0.0.4 description SPINE2
   network 10.255.0.11/32
   network 172.16.101.0/30
!
end