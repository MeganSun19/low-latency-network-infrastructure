hostname spine2
!
service routing protocols model multi-agent
!
ip routing
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.2/32
!
interface Ethernet1
   description TO_LEAF1_ETH2
   no switchport
   ip address 10.0.0.4/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description TO_LEAF2_ETH2
   no switchport
   ip address 10.0.0.6/31
   pim ipv4 sparse-mode
!
interface Ethernet3
   description TO_PUBLISHER_B
   no switchport
   ip address 172.16.2.1/30
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router bgp 65102
   router-id 10.255.0.2
   neighbor 10.0.0.5 remote-as 65201
   neighbor 10.0.0.5 description LEAF1
   neighbor 10.0.0.7 remote-as 65202
   neighbor 10.0.0.7 description LEAF2
   network 10.255.0.2/32
   network 172.16.2.0/30
!
end