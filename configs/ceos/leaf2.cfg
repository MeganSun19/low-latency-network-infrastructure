hostname leaf2
!
service routing protocols model multi-agent
!
ip routing
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.12/32
!
interface Ethernet1
   description TO_SPINE1_ETH2
   no switchport
   ip address 10.0.0.3/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description TO_SPINE2_ETH2
   no switchport
   ip address 10.0.0.7/31
   pim ipv4 sparse-mode
!
interface Ethernet4
   description TO_RECEIVER_B
   no switchport
   ip address 172.16.102.1/30
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router bgp 65202
   router-id 10.255.0.12
   neighbor 10.0.0.2 remote-as 65101
   neighbor 10.0.0.2 description SPINE1
   neighbor 10.0.0.6 remote-as 65102
   neighbor 10.0.0.6 description SPINE2
   network 10.255.0.12/32
   network 172.16.102.0/30
!
end