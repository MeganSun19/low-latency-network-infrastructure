hostname spine1
!
service routing protocols model multi-agent
!
ip routing
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.1/32
!
interface Ethernet1
   description TO_LEAF1_ETH1
   no switchport
   ip address 10.0.0.0/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description TO_LEAF2_ETH1
   no switchport
   ip address 10.0.0.2/31
   pim ipv4 sparse-mode
!
interface Ethernet3
   description TO_PUBLISHER_A
   no switchport
   ip address 172.16.1.1/30
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router bgp 65101
   router-id 10.255.0.1
   neighbor 10.0.0.1 remote-as 65201
   neighbor 10.0.0.1 description LEAF1
   neighbor 10.0.0.3 remote-as 65202
   neighbor 10.0.0.3 description LEAF2
   network 10.255.0.1/32
   network 172.16.1.0/30
!
end